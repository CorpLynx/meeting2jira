# Development tooling only: pytest and ruff config for working on this repo.
# Nothing here is needed at runtime. Asgard (with Odin, one of its apps since Oct 2026) installs by
# copying its folder; this file is not a package definition and Asgard never reads it.
# Install the tools with: python -m pip install -r requirements-dev.txt

[tool.pytest.ini_options]
testpaths = ["Asgard/tests"]
# Each test module puts Asgard/ and the app it tests on sys.path itself, as the entry points do.
# The tests stay plain unittest so they still run on the workstation with no pip; pytest is the
# dev runner (better failure output, timeouts, coverage).
addopts = "-q --strict-markers"
xfail_strict = true
# A hung test (e.g. a local HTTP server waiting forever) must not stall an agent loop.
timeout = 60

[tool.coverage.run]
source = ["Asgard/asgard", "Asgard/apps"]
branch = true

[tool.ruff]
target-version = "py39"      # Asgard/AGENTS.md: Python 3.9+
line-length = 120
extend-exclude = [".test-output", "infra"]

[tool.ruff.lint]
# Bug-finding rules only. The code is not ruff-formatted and keeps typing.List/Optional, which
# 3.9 needs at run time outside annotations, so the import-order and pyupgrade families stay off.
select = ["E", "W", "F", "B"]
ignore = ["E501"]  # long lines exist on purpose (regexes, messages); not worth churn
