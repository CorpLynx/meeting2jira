# Odin's checks on Windows: what a Linux or macOS checkout can't prove. Odin is an Asgard app
# (Asgard/apps/odin), with two optional exporters beside it in Odin/. The full target-machine checks
# (Outlook COM, DPAPI round trip, Task Scheduler) stay in Asgard/apps/odin/tools/Invoke-WindowsChecks.ps1
# (`odin selftest`) on the lab VM and the workstation; this covers the rest on every change to Odin:
#   - Odin's unit tests (Asgard/tests/test_odin_*.py, on a real Muninn) and the exporters', on Windows;
#   - every PowerShell script parsing under Windows PowerShell 5.1, the version on the workstation;
#   - each .cmd launcher moving either of Odin's old folders (%LOCALAPPDATA%\odin on the
#     on-premises install, %LOCALAPPDATA%\meeting2jira before that) to %LOCALAPPDATA%\Asgard\odin,
#     whole, the first time it runs, and refusing to guess when both are there.
# Actions are pinned to full commit SHAs (the tag each was is in its comment).
name: Odin checks

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "Odin/**"
      - "Asgard/apps/odin/**"
      - "Asgard/asgard/muninn/**"
      - "Asgard/tests/test_odin_*.py"
      - "Asgard/tests/fake_jira.py"
      - "Asgard/tests/fixtures/odin/**"
      - ".github/workflows/odin-checks.yml"
  pull_request:
    paths:
      - "Odin/**"
      - "Asgard/apps/odin/**"
      - "Asgard/asgard/muninn/**"
      - "Asgard/tests/test_odin_*.py"
      - "Asgard/tests/fake_jira.py"
      - "Asgard/tests/fixtures/odin/**"
      - ".github/workflows/odin-checks.yml"

permissions:
  contents: read

concurrency:
  group: odin-checks-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  windows:
    name: Odin on Windows
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Unit tests (Odin, graph-app, playwright-app)
        shell: pwsh
        run: |
          Push-Location Asgard
          python -m unittest discover -s tests -p "test_odin_*.py"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Pop-Location
          foreach ($app in @("graph-app", "playwright-app")) {
            Push-Location "Odin/$app"
            python -m unittest discover -s tests
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            Pop-Location
          }

      - name: PowerShell scripts parse under Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = 0
          Get-ChildItem -Path Odin, Asgard/apps/odin -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count) { $failed++; Write-Host "FAIL $($_.FullName)"; $errors | ForEach-Object { Write-Host "  $_" } }
            else { Write-Host "OK   $($_.Name)" }
          }
          Write-Host "PowerShell $($PSVersionTable.PSVersion)"
          if ($failed) { exit 1 }

      - name: Each launcher moves either old folder under Asgard
        shell: cmd
        run: |
          setlocal
          rem Both names Odin used before: %LOCALAPPDATA%\odin (the on-premises install) and
          rem %LOCALAPPDATA%\meeting2jira (the first version of all).
          for %%O in (odin meeting2jira) do for %%L in (Asgard\apps\odin\odin.cmd Odin\graph-app\odin-graph.cmd Odin\playwright-app\odin-owa.cmd) do call :moves "%%L" "%%O" || exit /b 1
          call :refuses "Asgard\apps\odin\odin.cmd" || exit /b 1
          echo All three launchers moved both old folders.
          exit /b 0

          :moves
          set "LOCALAPPDATA=%RUNNER_TEMP%\odin-move-%RANDOM%"
          set "ASGARD_HOME="
          mkdir "%LOCALAPPDATA%\%~2\logs"
          echo ciphertext> "%LOCALAPPDATA%\%~2\jira_token.dpapi"
          call "%~1" help >nul 2>&1
          if exist "%LOCALAPPDATA%\%~2\" (echo FAIL %~1 left %~2 behind & exit /b 1)
          if not exist "%LOCALAPPDATA%\Asgard\odin\jira_token.dpapi" (echo FAIL %~1 didn't move the token from %~2 & exit /b 1)
          if not exist "%LOCALAPPDATA%\Asgard\odin\logs\" (echo FAIL %~1 didn't move the logs from %~2 & exit /b 1)
          echo OK   %~1 moved %~2 to %LOCALAPPDATA%\Asgard\odin
          rem A second run with the new folder in place moves nothing and still works.
          mkdir "%LOCALAPPDATA%\%~2"
          call "%~1" help >nul 2>&1
          if not exist "%LOCALAPPDATA%\%~2\" (echo FAIL %~1 moved over an existing folder & exit /b 1)
          exit /b 0

          :refuses
          rem Two old folders at once: moving one could orphan the state.db in the other, so it stops.
          set "LOCALAPPDATA=%RUNNER_TEMP%\odin-both-%RANDOM%"
          set "ASGARD_HOME="
          mkdir "%LOCALAPPDATA%\odin"
          mkdir "%LOCALAPPDATA%\meeting2jira"
          call "%~1" help >nul 2>&1
          if not exist "%LOCALAPPDATA%\odin\" (echo FAIL %~1 moved one of two old folders & exit /b 1)
          if not exist "%LOCALAPPDATA%\meeting2jira\" (echo FAIL %~1 moved one of two old folders & exit /b 1)
          if exist "%LOCALAPPDATA%\Asgard\odin\" (echo FAIL %~1 made the new folder anyway & exit /b 1)
          echo OK   %~1 refused to guess between two old folders
          exit /b 0
