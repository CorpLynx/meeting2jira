# Lint config for development (the Kiro save hook and anyone running `ruff check`).
# Never needed at runtime: app/ stays stdlib-only and ruff is not installed on the target machine.
# Deliberately narrow: bug-finding rules only. The code is not ruff-formatted and keeps
# typing.List/Optional for Python 3.8, so the import-order and pyupgrade families stay off.
target-version = "py38"
line-length = 120
extend-exclude = [".test-output", "infra"]

[lint]
select = ["E", "W", "F", "B"]
ignore = ["E501"]  # long lines exist on purpose (regexes, messages); not worth churn
